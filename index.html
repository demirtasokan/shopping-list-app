<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f3f5f7;
      color: #1f2933;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 24px;
      height: fit-content;
    }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
    }
    input[type="text"]:focus { outline: 2px solid #2f80ed; border-color: transparent; }
    button {
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .add-btn { padding: 10px 16px; background: #2f80ed; color: #fff; }
    .add-btn:hover { background: #1c6ad1; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #eef1f4;
    }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #9aa5b1; }
    .delete-btn {
      background: transparent;
      color: #9aa5b1;
      font-size: 1.2rem;
      padding: 2px 8px;
    }
    .delete-btn:hover { color: #e03e3e; background: #fdecec; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 0.9rem;
      color: #616e7c;
    }
    .clear-btn { background: transparent; color: #616e7c; font-size: 0.9rem; padding: 4px 8px; }
    .clear-btn:hover { color: #e03e3e; }
    .clear-btn:disabled { visibility: hidden; }
    .empty { text-align: center; color: #9aa5b1; padding: 24px 0; }
    .status { min-height: 1.2em; margin: 0 0 12px; font-size: 0.9rem; color: #616e7c; }
    .status.error { color: #e03e3e; }
  </style>
</head>
<body>
  <main>
    <h1>🛒 Shopping List</h1>

    <form id="add-form">
      <input type="text" id="item-input" placeholder="Add an item, e.g. Milk" maxlength="100" autocomplete="off" required>
      <button type="submit" class="add-btn">Add</button>
    </form>

    <p class="status" id="status" role="status"></p>

    <ul id="list"></ul>
    <p class="empty" id="empty">Your list is empty.</p>

    <div class="footer">
      <span id="count"></span>
      <button type="button" class="clear-btn" id="clear-done">Clear checked</button>
    </div>
  </main>

  <script>
    // Supabase project. The publishable key is meant for browsers; what it can do
    // is limited by the row-level security policies on public.shopping_items.
    const SUPABASE_URL = 'https://gqmolxzpawmbzghxbfbu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XQFjN1r4zbk6RJBOKcU1SQ_4pxRI7rm';
    const TABLE = 'shopping_items';
    const LEGACY_STORAGE_KEY = 'shopping-list-items'; // old localStorage list, imported once

    const form = document.getElementById('add-form');
    const input = document.getElementById('item-input');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const clearDone = document.getElementById('clear-done');
    const statusEl = document.getElementById('status');

    let items = [];

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    // Small wrapper around Supabase's REST API (PostgREST).
    async function api(query, { method = 'GET', body, returning = false } = {}) {
      const headers = { apikey: SUPABASE_KEY };
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      if (returning) headers.Prefer = 'return=representation';

      const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}${query}`, {
        method,
        headers,
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      if (!res.ok) {
        let detail = '';
        try { detail = (await res.json()).message || ''; } catch { /* no JSON body */ }
        throw new Error(detail || `Request failed (${res.status})`);
      }
      // Inserts, updates and deletes answer with an empty body unless rows are returned.
      const payload = await res.text();
      return payload ? JSON.parse(payload) : null;
    }

    // Run a database action; on failure show the error and redraw from known-good state.
    async function run(action, failureMessage) {
      try {
        await action();
        setStatus('');
      } catch (err) {
        console.error(err);
        setStatus(`${failureMessage} (${err.message})`, true);
      }
      render();
    }

    function render() {
      list.innerHTML = '';

      for (const item of items) {
        const li = document.createElement('li');
        if (item.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.done;
        checkbox.setAttribute('aria-label', `Mark ${item.text} as bought`);
        checkbox.addEventListener('change', () => toggleItem(item.id));

        const text = document.createElement('span');
        text.textContent = item.text;

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.setAttribute('aria-label', `Delete ${item.text}`);
        del.addEventListener('click', () => deleteItem(item.id));

        li.append(checkbox, text, del);
        list.appendChild(li);
      }

      const doneCount = items.filter(i => i.done).length;
      empty.style.display = items.length ? 'none' : 'block';
      count.textContent = items.length ? `${doneCount} of ${items.length} checked` : '';
      clearDone.disabled = doneCount === 0;
    }

    function addItem(text) {
      return run(async () => {
        const [created] = await api('', { method: 'POST', body: { text }, returning: true });
        items.push(created);
      }, 'Could not add the item');
    }

    function toggleItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const done = !item.done;
      return run(async () => {
        await api(`?id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', body: { done } });
        item.done = done;
      }, 'Could not update the item');
    }

    function deleteItem(id) {
      return run(async () => {
        await api(`?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
        items = items.filter(i => i.id !== id);
      }, 'Could not delete the item');
    }

    function clearChecked() {
      return run(async () => {
        await api('?done=eq.true', { method: 'DELETE' });
        items = items.filter(i => !i.done);
      }, 'Could not clear the checked items');
    }

    // One-time import of a list saved by the earlier localStorage version of this app.
    async function importLegacyItems() {
      let legacy;
      try {
        legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY));
      } catch {
        return;
      }
      if (!Array.isArray(legacy) || legacy.length === 0) return;

      const rows = legacy
        .filter(i => i && typeof i.text === 'string' && i.text.trim())
        .map(i => ({ text: i.text.trim().slice(0, 100), done: Boolean(i.done) }));
      if (rows.length) await api('', { method: 'POST', body: rows });
      localStorage.removeItem(LEGACY_STORAGE_KEY); // only after the upload succeeded
    }

    async function loadItems() {
      setStatus('Loading your list…');
      try {
        await importLegacyItems();
        items = await api('?select=id,text,done&order=created_at.asc');
        setStatus('');
      } catch (err) {
        console.error(err);
        setStatus(`Could not load your list (${err.message})`, true);
      }
      render();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await addItem(text);
      input.focus();
    });

    clearDone.addEventListener('click', clearChecked);

    render();
    loadItems();
  </script>
</body>
</html>
